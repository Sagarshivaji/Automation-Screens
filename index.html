<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Automation UI Pattern Animation · Sidebar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }

  body {
    background: radial-gradient(circle at 20% 0%, #142b45 0%, #0a1626 55%, #060d16 100%);
    min-height: 100vh;
    color: #e6eef8;
    overflow: hidden;
  }

  /* ============ LAYOUT ============ */
  .layout {
    display: flex;
    height: 100vh;
  }

  /* ============ SIDEBAR ============ */
  .sidebar {
    width: 260px;
    background: #081524;
    border-right: 1px solid #16304d;
    display: flex;
    flex-direction: column;
    padding: 1.25rem .85rem 1rem;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: #1e3a5c; border-radius: 10px; }

  .brand {
    display: flex;
    align-items: center;
    gap: .6rem;
    padding: 0 .4rem .9rem;
    border-bottom: 1px solid #16304d;
    margin-bottom: .9rem;
  }
  .brand i {
    color: #38bdf8;
    font-size: 1.35rem;
    animation: pulse 2s infinite;
  }
  .brand h1 {
    font-size: .95rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: -.01em;
    line-height: 1.15;
  }
  .brand span {
    display: block;
    font-size: .6rem;
    color: #4a6a8a;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-top: 1px;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%     { opacity: .6; transform: scale(1.15); }
  }

  /* family nav */
  .nav-label {
    font-size: .6rem;
    color: #4a6a8a;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 0 .5rem .5rem;
    font-weight: 600;
  }

  .nav-list { display: flex; flex-direction: column; gap: .18rem; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: .65rem;
    padding: .55rem .7rem;
    border-radius: 10px;
    cursor: pointer;
    color: #8ba4bd;
    font-size: .78rem;
    font-weight: 500;
    transition: all .16s ease;
    border: 1px solid transparent;
    position: relative;
  }
  .nav-item .num {
    font-size: .58rem;
    background: #142a44;
    color: #7dd3fc;
    width: 20px; height: 20px;
    display: grid; place-items: center;
    border-radius: 5px;
    font-weight: 700;
    flex-shrink: 0;
    transition: all .16s;
  }
  .nav-item i {
    font-size: .82rem;
    width: 1rem;
    text-align: center;
    color: #5b7ea3;
    transition: color .16s;
  }
  .nav-item .name { flex: 1; line-height: 1.15; }

  .nav-item:hover {
    background: #0e2138;
    color: #d7e8f8;
  }
  .nav-item:hover i { color: #7dd3fc; }

  .nav-item.active {
    background: linear-gradient(90deg, #16304d 0%, #102640 100%);
    color: #fff;
    border-color: #2f5679;
    box-shadow: 0 4px 12px -4px rgba(56,189,248,.35);
  }
  .nav-item.active .num {
    background: #2f7ab5;
    color: #fff;
    box-shadow: 0 0 8px rgba(56,189,248,.7);
  }
  .nav-item.active i { color: #38bdf8; }

  .sidebar-footer {
    margin-top: auto;
    padding: .8rem .5rem 0;
    border-top: 1px solid #16304d;
    font-size: .62rem;
    color: #4a6a8a;
    display: flex;
    align-items: center;
    gap: .4rem;
  }
  .sidebar-footer .live-dot {
    width: 6px; height: 6px;
    background: #34d399;
    border-radius: 50%;
    box-shadow: 0 0 8px #34d399;
    animation: blink 1.2s infinite;
  }
  @keyframes blink {
    0%,100% { opacity:1; }
    50%     { opacity:.3; }
  }

  /* ============ MAIN AREA ============ */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .main-head {
    padding: 1.4rem 2rem 1rem;
    border-bottom: 1px solid #16304d;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-shrink: 0;
    background: rgba(8,21,36,.5);
    backdrop-filter: blur(8px);
  }
  .main-head .icon-wrap {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, #16304d, #0e2138);
    border: 1px solid #2f5679;
    border-radius: 12px;
    display: grid; place-items: center;
    color: #38bdf8;
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  .main-head h2 {
    font-size: 1.15rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: -.01em;
  }
  .main-head .desc {
    font-size: .72rem;
    color: #7c93ab;
    margin-top: .15rem;
  }
  .main-head .counter {
    margin-left: auto;
    font-size: .65rem;
    background: #0e2138;
    border: 1px solid #1e3a5c;
    color: #7dd3fc;
    padding: .35rem .75rem;
    border-radius: 30px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: .35rem;
    white-space: nowrap;
  }
  .main-head .counter i { font-size: .6rem; }

  /* screens grid */
  .grid {
    flex: 1;
    overflow-y: auto;
    padding: 1.4rem 2rem 2rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
    align-content: start;
  }
  .grid::-webkit-scrollbar { width: 10px; }
  .grid::-webkit-scrollbar-track { background: #0a1626; }
  .grid::-webkit-scrollbar-thumb { background: #1e3a5c; border-radius: 10px; }
  .grid::-webkit-scrollbar-thumb:hover { background: #2f5679; }

  /* ============ SCREEN CARD ============ */
  .screen {
    background: #0f2138;
    border: 1px solid #1e3a5c;
    border-radius: 16px;
    padding: 1rem 1.1rem 1.15rem;
    display: flex;
    flex-direction: column;
    gap: .65rem;
    position: relative;
    overflow: hidden;
    transition: all .3s;
    min-height: 170px;
    opacity: 0;
    animation: cardIn .4s forwards;
  }

  @keyframes cardIn {
    to { opacity: 1; }
  }

  .screen:hover {
    border-color: #2f6ea5;
    box-shadow: 0 12px 28px -12px rgba(56,189,248,.35);
    transform: translateY(-2px);
  }

  .screen-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .screen-head h3 {
    font-size: .82rem;
    font-weight: 650;
    color: #cbe3fa;
    letter-spacing: .01em;
    display: flex;
    align-items: center;
    gap: .4rem;
  }
  .screen-head h3 i { color: #38bdf8; font-size: .8rem; }
  .screen-tag {
    font-size: .6rem;
    background: #1a3352;
    color: #7dd3fc;
    padding: .15rem .5rem;
    border-radius: 30px;
    font-weight: 700;
    letter-spacing: .4px;
    text-transform: uppercase;
  }

  .screen-body {
    font-size: .74rem;
    color: #9fb6cd;
    line-height: 1.5;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: .5rem;
    justify-content: center;
  }

  /* ========== STATUS DOTS ========== */
  .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-right: .3rem;
    vertical-align: middle;
  }
  .dot-green  { background:#34d399; box-shadow:0 0 8px #34d399; animation: blink 1.4s infinite; }
  .dot-blue   { background:#38bdf8; box-shadow:0 0 8px #38bdf8; animation: blink 1s infinite; }
  .dot-amber  { background:#fbbf24; box-shadow:0 0 8px #fbbf24; animation: blink 1.6s infinite; }
  .dot-red    { background:#f87171; box-shadow:0 0 8px #f87171; animation: blink .9s infinite; }
  .dot-grey   { background:#64748b; }
  .dot-purple { background:#c084fc; box-shadow:0 0 8px #c084fc; animation: blink 1.2s infinite; }

  /* ========== PROGRESS BARS ========== */
  .bar-track {
    background: #172b44;
    border-radius: 30px;
    height: 8px;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    border-radius: 30px;
    background: linear-gradient(90deg, #38bdf8, #34d399);
    width: 0%;
    transition: width .5s ease;
    box-shadow: 0 0 10px rgba(56,189,248,.6);
  }
  .bar-fill.slow { background: linear-gradient(90deg, #a78bfa, #38bdf8); }
  .bar-fill.warn { background: linear-gradient(90deg, #fbbf24, #f87171); }

  .bar-label {
    display: flex;
    justify-content: space-between;
    font-size: .68rem;
    color: #7c93ab;
    margin-top: .25rem;
  }

  /* ========== CIRCULAR PROGRESS ========== */
  .circular {
    width: 60px; height: 60px;
    position: relative;
    margin: 0 auto;
  }
  .circular svg { transform: rotate(-90deg); }
  .circular .bg { stroke: #172b44; }
  .circular .fg {
    stroke: #38bdf8;
    stroke-linecap: round;
    transition: stroke-dashoffset .5s ease;
    filter: drop-shadow(0 0 4px rgba(56,189,248,.7));
  }
  .circular .pct {
    position: absolute;
    inset: 0;
    display: grid; place-items: center;
    font-size: .78rem;
    font-weight: 700;
    color: #cbe3fa;
  }

  /* ========== STEPPER / TIMELINE ========== */
  .steps {
    display: flex;
    flex-direction: column;
    gap: .3rem;
    font-size: .72rem;
  }
  .step {
    display: flex;
    align-items: center;
    gap: .5rem;
    color: #64748b;
    transition: color .3s;
  }
  .step.active { color: #38bdf8; font-weight: 600; }
  .step.done   { color: #34d399; }
  .step i { font-size: .7rem; width: 14px; text-align: center; }
  .step.done i  { color: #34d399; }
  .step.active i{ color: #38bdf8; animation: spin 1s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* horizontal pipeline */
  .pipeline {
    display: flex;
    align-items: center;
    gap: .3rem;
    font-size: .68rem;
    flex-wrap: wrap;
  }
  .pipe-node {
    padding: .15rem .45rem;
    border-radius: 6px;
    background: #172b44;
    color: #64748b;
    border: 1px solid transparent;
    transition: all .3s;
  }
  .pipe-node.done   { background: #133a2e; color: #34d399; border-color: #1f6b52; }
  .pipe-node.active { background: #0e3350; color: #38bdf8; border-color: #2f6ea5; animation: glow 1.2s infinite; }
  .pipe-arrow { color: #2f5679; }

  @keyframes glow {
    0%,100% { box-shadow: 0 0 0 rgba(56,189,248,0); }
    50%     { box-shadow: 0 0 12px rgba(56,189,248,.5); }
  }

  /* ========== TRACE / LOG ========== */
  .trace {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: .66rem;
    line-height: 1.7;
    color: #9fb6cd;
    background: #0a1828;
    border-radius: 10px;
    padding: .55rem .7rem;
    max-height: 120px;
    overflow: hidden;
    border-left: 2px solid #2f6ea5;
  }
  .trace .line {
    opacity: 0;
    transform: translateX(-6px);
    animation: slideIn .4s forwards;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .trace .line .time { color: #4a6a8a; }
  .trace .line .info { color: #38bdf8; }
  .trace .line .warn { color: #fbbf24; }
  .trace .line .err  { color: #f87171; }
  .trace .line .ok   { color: #34d399; }

  @keyframes slideIn {
    to { opacity: 1; transform: translateX(0); }
  }

  /* ========== ACTIVITY FEED ========== */
  .feed {
    display: flex;
    flex-direction: column;
    gap: .35rem;
  }
  .feed-item {
    display: flex;
    align-items: center;
    gap: .5rem;
    font-size: .7rem;
    color: #9fb6cd;
    opacity: 0;
    animation: feedIn .4s forwards;
  }
  .feed-item .when {
    font-size: .62rem;
    color: #4a6a8a;
    min-width: 55px;
  }
  .feed-item i { color: #38bdf8; font-size: .7rem; }

  @keyframes feedIn {
    from { opacity:0; transform: translateY(6px); }
    to   { opacity:1; transform: translateY(0); }
  }

  /* ========== GRAPH ========== */
  .graph {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .15rem;
    font-size: .68rem;
  }
  .g-node {
    padding: .2rem .6rem;
    border-radius: 8px;
    background: #172b44;
    color: #64748b;
    border: 1px solid #1e3a5c;
    transition: all .4s;
    position: relative;
  }
  .g-node.done   { background:#133a2e; color:#34d399; border-color:#1f6b52; }
  .g-node.active { background:#0e3350; color:#38bdf8; border-color:#2f6ea5; animation: glow 1.2s infinite; }
  .g-node.warn   { background:#3a2c10; color:#fbbf24; border-color:#6b5320; }
  .g-node.fail   { background:#3a1414; color:#f87171; border-color:#6b2020; animation: shake .5s infinite; }
  .g-arrow { color: #2f5679; font-size: .7rem; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-2px); }
    75%     { transform: translateX(2px); }
  }

  /* ========== APPROVAL PANEL ========== */
  .approval {
    background: #2a2210;
    border: 1px solid #6b5320;
    border-radius: 10px;
    padding: .65rem .75rem;
    animation: glowAmber 2s infinite;
  }
  .approval .title {
    color: #fbbf24;
    font-weight: 700;
    font-size: .75rem;
    display: flex;
    align-items: center;
    gap: .35rem;
    margin-bottom: .35rem;
  }
  .approval .btns {
    display: flex;
    gap: .35rem;
    margin-top: .5rem;
  }
  .btn {
    font-size: .65rem;
    padding: .25rem .55rem;
    border-radius: 6px;
    border: 1px solid #2f5679;
    background: #0e2138;
    color: #7dd3fc;
    cursor: pointer;
    font-weight: 600;
    transition: all .2s;
  }
  .btn:hover { background: #16304d; border-color: #38bdf8; }
  .btn.primary {
    background: #0e3350;
    border-color: #38bdf8;
    color: #fff;
    animation: pulseBtn 1.8s infinite;
  }
  @keyframes pulseBtn {
    0%,100% { box-shadow: 0 0 0 rgba(56,189,248,0); }
    50%     { box-shadow: 0 0 14px rgba(56,189,248,.55); }
  }

  @keyframes glowAmber {
    0%,100% { box-shadow: 0 0 0 rgba(251,191,36,0); }
    50%     { box-shadow: 0 0 16px rgba(251,191,36,.25); }
  }

  /* ========== ALERT BOXES ========== */
  .alert {
    border-radius: 10px;
    padding: .65rem .75rem;
    font-size: .72rem;
    display: flex;
    flex-direction: column;
    gap: .3rem;
    border-left: 3px solid;
  }
  .alert .title {
    font-weight: 700;
    font-size: .76rem;
    display: flex;
    align-items: center;
    gap: .4rem;
  }
  .alert.warn   { background:#2a2210; border-color:#fbbf24; color:#fcd97a; }
  .alert.danger { background:#2a1414; border-color:#f87171; color:#fca5a5; animation: shake .6s infinite; }
  .alert.ok     { background:#0f2a20; border-color:#34d399; color:#6ee7b7; }
  .alert.info   { background:#0f2138; border-color:#38bdf8; color:#7dd3fc; }

  /* ========== RESULT / CHECKMARK ========== */
  .check-big {
    font-size: 2.4rem;
    color: #34d399;
    text-align: center;
    animation: popIn .6s ease, pulse 2s infinite;
  }
  @keyframes popIn {
    0%   { transform: scale(0); opacity: 0; }
    60%  { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ========== MINI STATS GRID ========== */
  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: .4rem;
  }
  .stat {
    background: #0a1828;
    border-radius: 8px;
    padding: .4rem .5rem;
    text-align: center;
  }
  .stat .val { font-size: .9rem; font-weight: 700; color: #7dd3fc; }
  .stat .lbl { font-size: .58rem; color: #4a6a8a; text-transform: uppercase; letter-spacing: .4px; }

  /* ========== COUNTDOWN ========== */
  .countdown {
    font-family: 'SF Mono', monospace;
    font-size: 1.1rem;
    color: #fbbf24;
    text-align: center;
    font-weight: 700;
    letter-spacing: .5px;
  }

  /* ========== TYPING CURSOR ========== */
  .cursor::after {
    content: '▌';
    color: #38bdf8;
    animation: blink .8s infinite;
    margin-left: 1px;
  }

  /* ========== CAPACITY BARS ========== */
  .cap-row {
    display: flex;
    align-items: center;
    gap: .5rem;
    font-size: .68rem;
    color: #9fb6cd;
  }
  .cap-row .name { min-width: 90px; color: #7c93ab; }
  .cap-row .bar-track { flex: 1; height: 6px; }

  /* mobile */
  @media (max-width: 760px) {
    .layout { flex-direction: column; height: auto; }
    body { overflow: auto; }
    .sidebar { width: 100%; height: auto; flex-direction: row; flex-wrap: wrap; overflow: visible; }
    .brand { border-bottom: none; margin-bottom: 0; padding-bottom: 0; width: 100%; }
    .nav-label { display: none; }
    .nav-list { flex-direction: row; flex-wrap: wrap; flex: 1; }
    .sidebar-footer { display: none; }
    .main { overflow: visible; }
    .grid { overflow: visible; }
  }
</style>
</head>
<body>

<div class="layout">
  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">
    <div class="brand">
      <i class="fas fa-robot"></i>
      <h1>Automation UI<span>Live pattern library</span></h1>
    </div>

    <div class="nav-label">Families · 10</div>
    <nav class="nav-list" id="navList"></nav>

    <div class="sidebar-footer">
      <span class="live-dot"></span>
      <span>All screens animating live</span>
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <main class="main">
    <div class="main-head">
      <div class="icon-wrap" id="headIcon"><i class="fas fa-sliders"></i></div>
      <div>
        <h2 id="headTitle">Setup</h2>
        <div class="desc" id="headDesc">Screens that happen before automation starts</div>
      </div>
      <div class="counter" id="headCounter">
        <i class="fas fa-layer-group"></i> <span id="counterText">8 screens</span>
      </div>
    </div>

    <div class="grid" id="grid"></div>
  </main>
</div>

<script>
/* =====================================================================
   DATA — 10 families, each with animated screens
   Each screen has a `body` (HTML string). We inject them into the grid
   when the family is selected. Animations run via a global setInterval
   registry so they don't leak when switching families.
   ===================================================================== */

const FAMILIES = [
  { id:'setup', icon:'fa-sliders', title:'Setup', desc:'Screens that happen before automation starts' },
  { id:'pre',   icon:'fa-clipboard-check', title:'Pre-Execution', desc:'Plan, review, pre-flight, safety' },
  { id:'exec',  icon:'fa-play-circle', title:'Execution / Progress', desc:'The running state — bars, steppers, graphs, traces' },
  { id:'mon',   icon:'fa-chart-line', title:'Monitoring', desc:'Across all automations' },
  { id:'hitl',  icon:'fa-user-check', title:'Human-in-the-Loop', desc:'Waiting for a human to decide' },
  { id:'exc',   icon:'fa-triangle-exclamation', title:'Exception', desc:'Non-normal execution states' },
  { id:'rec',   icon:'fa-rotate-left', title:'Recovery', desc:'Retry · resume · rollback' },
  { id:'comp',  icon:'fa-circle-check', title:'Completion', desc:'Success and endings' },
  { id:'hist',  icon:'fa-clock-rotate-left', title:'History / Investigation', desc:'After execution — logs, audit, replay' },
  { id:'adm',   icon:'fa-shield-halved', title:'Administration / Health', desc:'Governance, cost, SLA' },
];

/* =====================================================================
   ANIMATION REGISTRY
   Every setInterval we create gets stored so switching families can
   clear them. Prevents runaway loops when jumping between families.
   ===================================================================== */
let activeIntervals = [];
function reg(id) { activeIntervals.push(id); return id; }
function clearAll() {
  activeIntervals.forEach(clearInterval);
  activeIntervals = [];
}

/* =====================================================================
   SCREEN BUILDERS — one function per family, returns HTML + a start()
   function that kicks off the animations for that family.
   ===================================================================== */

/* ---------- 1. SETUP ---------- */
function buildSetup() {
  const html = `
    <div class="screen"><div class="screen-head"><h3><i class="fas fa-list"></i> Automation List</h3><span class="screen-tag">live</span></div>
      <div class="screen-body">
        <div><span class="dot dot-green"></span> Job Discovery &nbsp; Active</div>
        <div><span class="dot dot-green"></span> Lead Generator &nbsp; Active</div>
        <div><span class="dot dot-amber"></span> Email Campaign &nbsp; Paused</div>
        <div><span class="dot dot-grey"></span> Resume Optimizer &nbsp; Draft</div>
      </div></div>

    <div class="screen"><div class="screen-head"><h3><i class="fas fa-chart-simple"></i> Dashboard</h3><span class="screen-tag">live</span></div>
      <div class="screen-body">
        <div class="stats">
          <div class="stat"><div class="val" id="dash-active">0</div><div class="lbl">Active</div></div>
          <div class="stat"><div class="val" id="dash-running">0</div><div class="lbl">Running</div></div>
          <div class="stat"><div class="val" id="dash-failed">0</div><div class="lbl">Failed</div></div>

      dash.failed  = Math.min(dash.failed + (Math.random()>.7?1:0), 2);
      dash.done    = Math.min(dash.done+2, 42);
      dash.rate    = Math.min(dash.rate+4, 96);
      const el = id => document.getElementById(id);
      if (el('dash-active'))  el('dash-active').textContent  = dash.active;
      if (el('dash-running')) el('dash-running').textContent = dash.running;
      if (el('dash-failed'))  el('dash-failed').textContent  = dash.failed;
      if (el('dash-done'))    el('dash-done').textContent    = dash.done;
      if (el('dash-rate'))    el('dash-rate').textContent    = dash.rate + '%';
    }, 400));

    let tplIdx = 0;

      document.querySelectorAll('.tpl-item').forEach((el,i) => {

        el.style.transition='.3s';
      });
      tplIdx = (tplIdx+1)%5;
    }, 900));

    const phrases = ['Job Discovery','Email Campaign','Custom workflow'];
    let pIdx=0,cIdx=0,deleting=false;
    reg(setInterval(() => {
      const el = document.getElementById('create-type');
      if (!el) return;
      const full = phrases[pIdx];
      if (!deleting) { cIdx++; if (cIdx>full.length) { deleting=true; return; } }
      else { cIdx--; if (cIdx<0) { deleting=false; pIdx=(pIdx+1)%phrases.length; cIdx=0; return; } }
      el.textContent = full.slice(0,cIdx);
    }, 110));

    let bIdx=0;
    reg(setInterval(() => {
      document.querySelectorAll('#builder-graph .g-node').forEach((n,i) => {
        n.classList.remove('active','done');
        if (i<bIdx) n.classList.add('done');
        if (i===bIdx) n.classList.add('active');
      });
      bIdx = (bIdx+1)%6;
    }, 700));

    let cfgDir=1,cfgVal=500;
    reg(setInterval(() => {
      cfgVal += cfgDir*50;
      if (cfgVal>=1000){cfgVal=1000;cfgDir=-1;}
      if (cfgVal<=100){cfgVal=100;cfgDir=1;}
      const el = document.getElementById('cfg-max');
      const bar = document.getElementById('cfg-bar');
      if (el) el.textContent = cfgVal;
      if (bar) bar.style.width = (cfgVal/1000*100)+'%';
    }, 500));
  }
  return { html, start };
}

      ['1 min ago','Removed 6 duplicates'],
      ['2 min ago','Retrieved 42 jobs'],
      ['3 min ago','Started discovery'],
    ];

      div.innerHTML=`<span class="when">${f[0]}</span><i class="fas fa-circle-check"></i><span>${f[1]}</span>`;
      el.prepend(div);
      if(el.children.length>4)el.removeChild(el.lastChild);
      feedIdx++;
    }, 900));

    const logLines=[
      ['INFO','discovery.started'],
      ['INFO','source.linkedin.success'],
      ['INFO','jobs.received=42'],
      ['WARN','duplicate.detected=6'],
      ['INFO','analysis.started'],
      ['INFO','match.score.avg=0.82'],
    ];
    let logIdx=0;
    reg(setInterval(() => {
      const el=document.getElementById('log-console');
      if(!el)return;
      const l=logLines[logIdx%logLines.length];
      const div=document.createElement('div');
      div.className='line';
      const cls=l[0]==='WARN'?'warn':l[0]==='ERROR'?'err':'info';
      div.innerHTML=`<span class="${cls}">${l[0]}</span> ${l[1]}`;
      el.appendChild(div);
      if(el.children.length>5)el.removeChild(el.firstChild);
      logIdx++;
    }, 800));

    let monSec=0;
    reg(setInterval(() => {
      monSec++;

      const s=String(monSec%60).padStart(2,'0');

      if(dur)dur.textContent=`${m}:${s}`;
      if(items)items.textContent=Math.min(monSec*3,342);

      set('cmp2',cmp.b); set('cmp2b',Math.round(cmp.b*0.82));
      set('cmp3',cmp.c); set('cmp3b',1);
      set('cmp4',cmp.d+'m'); set('cmp4b','19m');
    }, 200));
  }
  return { html, start };
}

/* =====================================================================
   MAP family id → builder
   ===================================================================== */
const BUILDERS = {
  setup: buildSetup,
  pre:   buildPre,
  exec:  buildExec,
  mon:   buildMon,
  hitl:  buildHitl,
  exc:   buildExc,
  rec:   buildRec,
  comp:  buildComp,
  hist:  buildHist,
  adm:   buildAdm,
};

/* =====================================================================
   RENDER
   ===================================================================== */
const navList = document.getElementById('navList');
const grid = document.getElementById('grid');
const headIcon = document.getElementById('headIcon');
const headTitle = document.getElementById('headTitle');
const headDesc  = document.getElementById('headDesc');
const counterText = document.getElementById('counterText');

let activeId = 'setup';

function buildNav() {
  navList.innerHTML = '';
  FAMILIES.forEach((fam, i) => {
    const el = document.createElement('div');
    el.className = 'nav-item' + (fam.id === activeId ? ' active' : '');
    el.dataset.id = fam.id;
    el.innerHTML = `
      <span class="num">${i + 1}</span>
      <i class="fas ${fam.icon}"></i>
      <span class="name">${fam.title}</span>
    `;
    el.addEventListener('click', () => selectFamily(fam.id));
    navList.appendChild(el);
  });
}

function selectFamily(id) {
  if (id === activeId && grid.children.length > 0) return;

  // stop previous animations
  clearAll();

  activeId = id;

  // update nav active state
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });

  const fam = FAMILIES.find(f => f.id === id);
  if (!fam) return;

  // update header
  headIcon.innerHTML = `<i class="fas ${fam.icon}"></i>`;
  headTitle.textContent = fam.title;
  headDesc.textContent  = fam.desc;

  // build screens
  const builder = BUILDERS[id];
  if (!builder) return;

  const { html, start } = builder();
  grid.innerHTML = html;

  // count rendered screens
  const count = grid.children.length;
  counterText.textContent = `${count} screens`;

  // start animations
  start();

  // scroll to top
  grid.scrollTop = 0;
}

/* =====================================================================
   INIT
   ===================================================================== */
buildNav();
selectFamily('setup');
</script>
